name: Kiểm tra
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run security:audit
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Cài Gitleaks đã xác minh checksum
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks/gitleaks" >> "$GITHUB_ENV"
      - name: Quét secret trong Git, source và frontend build
        run: npm run security:secrets
      - name: Ghi commit của bản phát hành
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; writeFileSync("dist/deployment.json", JSON.stringify({ commit: process.env.GITHUB_SHA }) + "\n");'
      - name: Lưu frontend đã kiểm tra
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
  deploy:
    name: Deploy oh.io.vn
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://oh.io.vn
    concurrency:
      group: oh-io-vn-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bỏ qua commit đã có bản mới hơn
        id: current
        shell: bash
        run: |
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Bỏ qua commit $GITHUB_SHA vì main đã chuyển sang $latest." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.current.outputs.deploy == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
        if: steps.current.outputs.deploy == 'true'
      - name: Tải frontend của đúng commit
        if: steps.current.outputs.deploy == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-${{ github.sha }}
          path: dist/
      - name: Triển khai Cloudflare Worker
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Thiếu secret CLOUDFLARE_API_TOKEN trong environment production."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Thiếu variable CLOUDFLARE_ACCOUNT_ID trong environment production."; exit 1; }
          version_tag="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          npx wrangler versions upload --tag "$version_tag" --message "GitHub Actions $GITHUB_SHA"
          npx wrangler versions deploy --version-tag "$version_tag@100" --yes --message "GitHub Actions $GITHUB_SHA"
      - name: Kiểm tra website sau deploy
        if: steps.current.outputs.deploy == 'true'
        run: node scripts/verify-deployment.mjs "$GITHUB_SHA"
