# Copy this workflow ONLY to the private oh-io-vn/backups repository.
name: Sao lưu dữ liệu riêng tư
on:
  schedule:
    - cron: "41 18 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-backup
  cancel-in-progress: false
jobs:
  backup:
    if: vars.BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Tải, mã hóa và tự kiểm chứng
        run: node backup.mjs create
        env:
          BACKUP_ORIGIN: https://oh.io.vn
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encrypted-d1-backup
          path: backups/*.ohbk
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Xác nhận bản sao đã tải lên kho riêng tư
        run: node backup.mjs ack
        env:
          BACKUP_ORIGIN: https://oh.io.vn
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
